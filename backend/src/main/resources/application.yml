spring:
  application:
    name: task-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
    username: ${DB_USERNAME:task_tracker}
    password: ${DB_PASSWORD:task_tracker}

  jpa:
    hibernate:
      # Схемой управляет Flyway, Hibernate только сверяет с ней маппинги
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Теги у задач грузятся лениво. Без этой настройки список из 20 задач
        # дал бы 1 запрос за задачами плюс по одному за тегами каждой (проблема N+1).
        # Hibernate догружает теги пачками по 50 задач — получается 2 запроса вместо 21.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    kz.tasktracker: DEBUG
