spring:
  application:
    name: task-tracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
    username: ${DB_USERNAME:task_tracker}
    password: ${DB_PASSWORD:task_tracker}

  jpa:
    hibernate:
      # Схемой управляет Flyway, Hibernate только сверяет с ней маппинги
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    kz.tasktracker: DEBUG
